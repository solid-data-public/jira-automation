name: JIRA Analysis Pipeline

on:
  repository_dispatch:
    types: [jira_analysis_request, jira_comment_reply]
  workflow_dispatch:
    inputs:
      issue_key:
        description: "JIRA issue key (e.g. PROJECT-123)"
        required: true
        default: "SA-1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: sunspectra_prod
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve run mode
        id: mode
        run: |
          ISSUE_KEY="${{ github.event.client_payload.issue_key || github.event.inputs.issue_key }}"
          if [ -z "$ISSUE_KEY" ]; then
            echo "Error: issue_key not in payload"
            exit 1
          fi
          echo "issue_key=$ISSUE_KEY" >> $GITHUB_OUTPUT
          if [ "${{ github.event.action }}" = "jira_comment_reply" ]; then
            echo "is_reply=true" >> $GITHUB_OUTPUT
          else
            echo "is_reply=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch JIRA issue
        id: fetch_issue
        if: steps.mode.outputs.is_reply != 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python scripts/fetch_jira_issue.py --issue-key "${{ steps.mode.outputs.issue_key }}" \
            --summary-file issue_summary.txt \
            --description-file issue_description.txt \
            --no-stdout

      - name: Fetch JIRA comments
        id: fetch_comments
        if: steps.mode.outputs.is_reply == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python scripts/fetch_jira_comments.py --issue-key "${{ steps.mode.outputs.issue_key }}" \
            --session-file session.txt \
            --user-comment-file user_comment.txt \
            --no-stdout

      - name: Exchange Solid management key for token
        id: solid_auth
        env:
          SOLIDDATA_MANAGEMENT_KEY: ${{ secrets.SOLIDDATA_MANAGEMENT_KEY }}
        run: |
          TOKEN=$(python scripts/exchange_solid_token.py)
          echo "SOLIDDATA_TOKEN<<TOKEN_EOF" >> $GITHUB_ENV
          echo "$TOKEN" >> $GITHUB_ENV
          echo "TOKEN_EOF" >> $GITHUB_ENV

      - name: Install Cursor CLI
        run: curl https://cursor.com/install -fsS | bash

      - name: Add Cursor to PATH
        run: echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Run Cursor analysis (first run)
        id: cursor
        if: steps.mode.outputs.is_reply != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          SOLIDDATA_TOKEN: ${{ env.SOLIDDATA_TOKEN }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SAVE_QUERIES_DIR: ${{ github.workspace }}/analysis_queries
        run: |
          mkdir -p "${{ github.workspace }}/analysis_queries"
          export PATH="$HOME/.cursor/bin:$PATH"

          python -c "
          with open('issue_summary.txt') as f: summary = f.read()
          with open('issue_description.txt') as f: description = f.read()
          issue_key = '''${{ steps.mode.outputs.issue_key }}'''
          prompt = '''You are analyzing JIRA ticket ''' + issue_key + ''': ''' + summary + '''

          Description:
          ''' + description + '''

          Use the sunspectra-ecommerce-analyst skill to conduct a full, deep, data-driven analysis.
          Follow the skill's workflow: clarify the question, generate SQL via mcp_solid-sunspectra_text2sql,
          execute via scripts/query_snowflake.py, interpret, and report. Be skeptical and evidence-based.

          Structure your output: put your reasoning/investigative process first, then the exact line ---REASONING_END--- on its own, then your final response (Finding, Limitation, Recommendation). The reasoning will be attached; only the final response appears in the comment.'''
          with open('prompt.txt', 'w') as f: f.write(prompt)
          "

          agent -p --force --output-format stream-json "$(cat prompt.txt)" 2>/dev/null | tee cursor_output.json > /dev/null || true
          if [ -f cursor_output.json ] && python3 -c "
          import json, sys
          def extract():
            with open('cursor_output.json') as f:
              content = f.read()
            # Try whole file first (single JSON object, possibly pretty-printed)
            try:
              d = json.loads(content)
              if d.get('type') == 'result' and d.get('subtype') == 'success':
                return d
            except json.JSONDecodeError:
              pass
            # Try NDJSON (one JSON object per line)
            for line in content.splitlines():
              if line.strip():
                try:
                  d = json.loads(line)
                  if d.get('type') == 'result' and d.get('subtype') == 'success':
                    return d
                except json.JSONDecodeError:
                  pass
            return None
          try:
            d = extract()
            if d:
              with open('analysis_output.txt', 'w') as out: out.write(d.get('result', '')[:32000])
              with open('session_id.txt', 'w') as out: out.write(d.get('session_id', '') or '')
              sys.exit(0)
          except Exception: pass
          sys.exit(1)
          "; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            agent -p --force --output-format text "$(cat prompt.txt)" > analysis_output.txt 2>&1 || true
            if [ ! -s analysis_output.txt ]; then
              echo "Cursor CLI failed with no output. Check workflow logs." > analysis_output.txt
            fi
            touch session_id.txt
          fi

      - name: Run Cursor analysis (reply)
        id: cursor_reply
        if: steps.mode.outputs.is_reply == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          SOLIDDATA_TOKEN: ${{ env.SOLIDDATA_TOKEN }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SAVE_QUERIES_DIR: ${{ github.workspace }}/analysis_queries
        run: |
          mkdir -p "${{ github.workspace }}/analysis_queries"
          export PATH="$HOME/.cursor/bin:$PATH"

          USER_COMMENT=$(cat user_comment.txt 2>/dev/null || echo "")
          if [ -z "$USER_COMMENT" ]; then
            echo "Error: no user comment found"
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "No user comment to respond to." > analysis_output.txt
            touch session_id.txt
            exit 0
          fi

          if [ -f session.txt ] && [ -s session.txt ]; then
            SESSION_ID=$(cat session.txt)
            agent -p --force --output-format stream-json --resume "$SESSION_ID" "$USER_COMMENT" 2>/dev/null | tee cursor_output.json > /dev/null || true
          else
            python3 -c "
          issue_key = '''${{ steps.mode.outputs.issue_key }}'''
          user = open('user_comment.txt').read()
          prompt = '''You previously provided an analysis on JIRA ticket ''' + issue_key + '''. The user has now responded:

          ''' + user + '''

          Please address their feedback. Use the sunspectra-ecommerce-analyst skill if additional data analysis is needed.

          Structure your output: put your reasoning/investigative process first, then the exact line ---REASONING_END--- on its own, then your final response. The reasoning will be attached; only the final response appears in the comment.'''
          with open('fallback_prompt.txt', 'w') as f: f.write(prompt)
          "
            agent -p --force --output-format stream-json "$(cat fallback_prompt.txt)" 2>/dev/null | tee cursor_output.json > /dev/null || true
          fi

          if [ -f cursor_output.json ] && python3 -c "
          import json, sys
          def extract():
            with open('cursor_output.json') as f:
              content = f.read()
            try:
              d = json.loads(content)
              if d.get('type') == 'result' and d.get('subtype') == 'success': return d
            except json.JSONDecodeError: pass
            for line in content.splitlines():
              if line.strip():
                try:
                  d = json.loads(line)
                  if d.get('type') == 'result' and d.get('subtype') == 'success': return d
                except json.JSONDecodeError: pass
            return None
          try:
            d = extract()
            if d:
              with open('analysis_output.txt', 'w') as out: out.write(d.get('result', '')[:32000])
              with open('session_id.txt', 'w') as out: out.write(d.get('session_id', '') or '')
              sys.exit(0)
          except Exception: pass
          sys.exit(1)
          "; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            agent -p --force --output-format text "$(cat user_comment.txt)" > analysis_output.txt 2>&1 || true
            if [ ! -s analysis_output.txt ]; then
              echo "Cursor CLI failed. Session may have expired." > analysis_output.txt
            fi
            touch session_id.txt
          fi

      - name: Show analysis output
        if: always()
        run: |
          if [ -f analysis_output.txt ]; then
            echo "--- Analysis output ---"
            cat analysis_output.txt
            echo "--- End analysis output ---"
          else
            echo "No analysis_output.txt found."
          fi

      - name: Diagnose query files
        if: always()
        run: |
          echo "--- analysis_queries directory ---"
          QUERIES_DIR="${{ github.workspace }}/analysis_queries"
          if [ -d "$QUERIES_DIR" ]; then
            echo "Directory exists at $QUERIES_DIR. Contents:"
            ls -la "$QUERIES_DIR"/
            echo "File count: $(ls -1 "$QUERIES_DIR" 2>/dev/null | wc -l)"
          else
            echo "Directory does NOT exist at $QUERIES_DIR"
          fi
          echo "--- End diagnose ---"

      - name: Merge SQL queries
        if: always()
        run: |
          QUERIES_DIR="${{ github.workspace }}/analysis_queries"
          ATTACHMENTS_DIR="${{ github.workspace }}/jira_attachments"
          mkdir -p "$ATTACHMENTS_DIR"
          if [ "${{ steps.mode.outputs.is_reply }}" = "true" ]; then
            OUTPUT_NAME="reply_$(date +%Y%m%d_%H%M%S)_queries.sql"
          else
            OUTPUT_NAME="initial_analysis_queries.sql"
          fi
          python3 scripts/merge_sql_queries.py --input-dir "$QUERIES_DIR" --output-file "$ATTACHMENTS_DIR/$OUTPUT_NAME" || true

      - name: Split reasoning from response
        if: always()
        run: |
          if [ ! -f analysis_output.txt ]; then
            echo "Cursor CLI produced no output. Check workflow logs." > analysis_output.txt
          fi
          python3 -c "
          content = open('analysis_output.txt').read()
          d = '---REASONING_END---'
          if d in content:
            before, after = content.split(d, 1)
            if before.strip():
              open('reasoning.txt', 'w').write(before.strip())
            open('comment_content.txt', 'w').write(after.strip()[:32000])
          else:
            open('comment_content.txt', 'w').write(content[:32000])
          "

      - name: Post analysis to JIRA
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          ISSUE_KEY="${{ steps.mode.outputs.issue_key }}"
          if [ -z "$ISSUE_KEY" ]; then
            echo "Error: issue_key not available"
            exit 1
          fi

          CURSOR_STATUS="${{ steps.cursor.outputs.status }}${{ steps.cursor_reply.outputs.status }}"
          {
            if [ "$CURSOR_STATUS" != "success" ]; then
              echo "**Analysis failed.** See workflow logs for details."
              echo ""
              echo "---"
              echo "Raw output:"
              head -c 32000 analysis_output.txt
            else
              if [ "${{ steps.mode.outputs.is_reply }}" = "true" ]; then
                echo "**Response:**"
              else
                echo "**Analysis complete.**"
              fi
              echo ""
              cat comment_content.txt
            fi
          } > jira_comment_body.txt

          REASONING_ARG=""
          if [ -f reasoning.txt ] && [ -s reasoning.txt ]; then
            REASONING_ARG="--reasoning-file reasoning.txt"
          fi

          if [ -f session_id.txt ] && [ -s session_id.txt ]; then
            python scripts/post_to_jira.py --issue-key "$ISSUE_KEY" --attachments-dir "${{ github.workspace }}/jira_attachments" --append-session "$(cat session_id.txt)" $REASONING_ARG < jira_comment_body.txt
          else
            python scripts/post_to_jira.py --issue-key "$ISSUE_KEY" --attachments-dir "${{ github.workspace }}/jira_attachments" $REASONING_ARG < jira_comment_body.txt
          fi

      - name: Fail on Cursor error
        if: steps.cursor.outputs.status == 'failure' || steps.cursor_reply.outputs.status == 'failure'
        run: exit 1
